services:
  netbootxyz:
    container_name: netbootxyz
    environment:
      #- MENU_VERSION=2.0.84
      - WEB_APP_PORT=3000
    networks:
      - netboot_proxy
    ports:
      #- "3000:3000"
      - "69:69/udp"
      #- "8080:80"
    volumes:
      - ./config:/config
      - ./assets:/assets
    restart: unless-stopped
    image: ghcr.io/netbootxyz/netbootxyz

networks:
  netboot_proxy:
    external: true
