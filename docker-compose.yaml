services:
  netbootxyz:
    container_name: netbootxyz
    environment:
      #- MENU_VERSION=2.0.84
      - WEB_APP_PORT=3000
    networks:
      - netboot_proxy
    ports:
      #- "3000:3000"
      - "69:69/udp"
      #- "8080:80"
    volumes:
      - ./config:/config
      - ./assets:/assets
    restart: unless-stopped
    image: ghcr.io/netbootxyz/netbootxyz
  proxy-dhcp:
    container_name: proxy-dhcp
    build:
      network: host
      context: dnsmasq
    network_mode: host  # Temporary
    cap_add:
      - NET_ADMIN
    ports:
      - 67:67
      - 68:68
    environment:
      - subnet=192.168.1.0
      - pxe_server_ip=192.168.1.200

networks:
  netboot_proxy:
    external: true
